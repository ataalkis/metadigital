name: Build Signed Android Release

on:
  push:
    branches: [ main ]
    paths:
      - 'gelir-giderim/**'
      - '.github/workflows/release-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      KEYSTORE_B64: ${{ secrets.GELIR_GIDERIM_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.GELIR_GIDERIM_KEYSTORE_PASSWORD }}
      KEY_ALIAS: gelirgiderim

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate signing secrets
        run: |
          test -n "$KEYSTORE_B64" || (echo "Missing GELIR_GIDERIM_KEYSTORE_BASE64" && exit 1)
          test -n "$KEYSTORE_PASSWORD" || (echo "Missing GELIR_GIDERIM_KEYSTORE_PASSWORD" && exit 1)

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        working-directory: gelir-giderim
        run: npm install

      - name: Generate Android project
        working-directory: gelir-giderim
        env:
          CI: '1'
        run: npx expo prebuild --platform android --clean

      - name: Restore release keystore
        run: echo "$KEYSTORE_B64" | base64 --decode > gelir-giderim/android/app/release.keystore

      - name: Build signed release APK
        working-directory: gelir-giderim/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$(pwd)/app/release.keystore" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEYSTORE_PASSWORD"

      - name: Prepare APK
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./gelir-giderim/app.json').expo.version")
          VERSION_CODE=$(node -p "require('./gelir-giderim/app.json').expo.android.versionCode")
          APK="Gelir-Giderim-v${VERSION}.apk"
          cp gelir-giderim/android/app/build/outputs/apk/release/app-release.apk "$APK"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Verify APK signature
        shell: bash
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs "${{ steps.version.outputs.apk }}"

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gelir-Giderim-v${{ steps.version.outputs.version }}-signed
          path: ${{ steps.version.outputs.apk }}
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          APK="${{ steps.version.outputs.apk }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --title "Gelir Giderim $TAG" \
              --notes "Android sürümü $TAG (versionCode ${{ steps.version.outputs.version_code }})."
          fi
